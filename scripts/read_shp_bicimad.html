<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiciMAD – Estaciones Madrid</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: #1a1d27;
    border-bottom: 1px solid #2e3348;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #00c98e, #0085ff);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 {
    font-size: 16px; font-weight: 600; color: #fff;
  }
  header p {
    font-size: 12px; color: #7b82a0;
  }
  .stats {
    display: flex; gap: 20px; margin-left: auto;
  }
  .stat {
    text-align: right;
  }
  .stat-value {
    font-size: 18px; font-weight: 700; color: #00c98e;
  }
  .stat-label {
    font-size: 11px; color: #7b82a0; text-transform: uppercase; letter-spacing: 0.5px;
  }
  #map { flex: 1; }

  #drop-zone {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    background: #1a1d27ee;
    border: 2px dashed #00c98e;
    border-radius: 16px;
    padding: 40px 60px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
    max-width: 420px;
    width: 90%;
  }
  #drop-zone:hover { background: #22263aee; }
  #drop-zone .icon { font-size: 48px; margin-bottom: 12px; }
  #drop-zone h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  #drop-zone p { font-size: 13px; color: #7b82a0; line-height: 1.5; }
  #drop-zone .hint {
    margin-top: 16px;
    font-size: 11px;
    background: #2e3348;
    border-radius: 8px;
    padding: 8px 12px;
    color: #a0a8c0;
  }
  #file-input { display: none; }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 24px;
    background: #00c98e;
    color: #0f1117;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    border: none;
  }
  .btn:hover { background: #00dfa0; }

  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1001;
    background: #1a1d27ee;
    border-radius: 16px;
    padding: 32px 48px;
    text-align: center;
    display: none;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #2e3348;
    border-top-color: #00c98e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .leaflet-popup-content-wrapper {
    background: #1a1d27;
    color: #e8eaf0;
    border: 1px solid #2e3348;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip { background: #1a1d27; }
  .popup-title {
    font-size: 13px; font-weight: 700; color: #00c98e;
    margin-bottom: 8px; border-bottom: 1px solid #2e3348; padding-bottom: 6px;
  }
  .popup-row {
    font-size: 12px; color: #a0a8c0;
    margin: 3px 0; display: flex; gap: 6px;
  }
  .popup-row span:first-child { color: #7b82a0; min-width: 80px; }
  .popup-row span:last-child { color: #e8eaf0; }
</style>
</head>
<body>

<header>
  <div class="logo">🚲</div>
  <div>
    <h1>BiciMAD — Estaciones</h1>
    <p>Visor de datos shapefile · Madrid</p>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="count-val">—</div>
      <div class="stat-label">Estaciones</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="district-val">—</div>
      <div class="stat-label">Distritos</div>
    </div>
  </div>
</header>

<div id="map"></div>

<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  <div class="icon">📂</div>
  <h2>Carga tu carpeta _shp</h2>
  <p>Selecciona todos los archivos de tu shapefile BiciMAD</p>
  <div class="hint">Necesitas: .shp · .dbf · .shx · .prj</div>
  <button class="btn">Seleccionar archivos</button>
  <input type="file" id="file-input" multiple accept=".shp,.dbf,.shx,.prj,.cpg,.sbn,.sbx">
</div>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#a0a8c0">Cargando shapefile…</div>
</div>

<script>
const map = L.map('map', { zoomControl: true }).setView([40.416, -3.703], 12);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const stationIcon = (active) => L.divIcon({
  className: '',
  html: `<div style="
    width:12px;height:12px;
    background:${active ? '#00c98e' : '#ff5c5c'};
    border:2px solid ${active ? '#00ffb3' : '#ff8080'};
    border-radius:50%;
    box-shadow:0 0 6px ${active ? '#00c98e88' : '#ff5c5c88'};
  "></div>`,
  iconSize: [12,12], iconAnchor: [6,6]
});

function buildPopup(props) {
  const keys = Object.keys(props);
  const rows = keys.slice(0, 12).map(k => {
    const v = props[k];
    if (v === null || v === '' || v === undefined) return '';
    return `<div class="popup-row"><span>${k}</span><span>${v}</span></div>`;
  }).filter(Boolean).join('');
  const title = props['NOMBRE'] || props['NAME'] || props['DENOMINACI'] || props['ID'] || 'Estación';
  return `<div class="popup-title">🚲 ${title}</div>${rows}`;
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  const dz = document.getElementById('drop-zone');
  const loading = document.getElementById('loading');
  dz.style.display = 'none';
  loading.style.display = 'block';

  const buffers = {};
  await Promise.all(files.map(f => new Promise((res, rej) => {
    const ext = f.name.split('.').pop().toLowerCase();
    const r = new FileReader();
    r.onload = () => { buffers[ext] = r.result; res(); };
    r.onerror = rej;
    r.readAsArrayBuffer(f);
  })));

  loading.style.display = 'none';

  if (!buffers['shp'] || !buffers['dbf']) {
    alert('Faltan archivos. Asegúrate de incluir al menos .shp y .dbf');
    dz.style.display = 'block';
    return;
  }

  try {
    const shpParsed = shp.parseShp(buffers['shp']);
    const dbfParsed = shp.parseDbf(buffers['dbf']);
    const geojson = shp.combine([shpParsed, dbfParsed]);
    const features = geojson.features || [];

    const districts = new Set();
    let count = 0;
    const bounds = [];

    features.forEach(feat => {
      if (!feat.geometry) return;
      const props = feat.properties || {};
      const coords = feat.geometry.coordinates;
      const type = feat.geometry.type;

      const addMarker = (lat, lng, active) => {
        const marker = L.marker([lat, lng], { icon: stationIcon(active) });
        marker.bindPopup(buildPopup(props), { maxWidth: 260, autoPan: false });
        marker.on('mouseover', function() { this.openPopup(); });
        marker.on('mouseout', function() { this.closePopup(); });
        marker.addTo(map);
        return marker;
      };
      if (type === 'Point') {
        const [lng, lat] = coords;
        bounds.push([lat, lng]);
        const active = String(props['ESTADO'] || props['STATUS'] || '1') !== '0';
        addMarker(lat, lng, active);
        count++;
        const d = props['DISTRITO'] || props['DISTRICT'] || props['BARRIO'];
        if (d) districts.add(d);
      } else if (type === 'MultiPoint') {
        coords.forEach(([lng, lat]) => {
          bounds.push([lat, lng]);
          addMarker(lat, lng, true);
          count++;
        });
      }
    });

    document.getElementById('count-val').textContent = count.toLocaleString();
    document.getElementById('district-val').textContent = districts.size || '—';

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }

  } catch (err) {
    console.error(err);
    alert('Error al procesar el shapefile: ' + err.message);
    dz.style.display = 'block';
  }
});
</script>
</body>
</html>
