<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor de Archivos</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <h1>📂 Visor de archivos</h1>
    <div id="app">
        <div id="sidebar">
            <div id="sidebar-header">Carpetas</div>
            <div id="tree">
                <div
                    style="padding: 24px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; color:#aaa; font-size:12px; text-align:center; line-height:1.5;">
                    <span style="font-size:28px; opacity:0.3;">📁</span>
                    Carga elementos para ver la estructura
                </div>
            </div>
        </div>
        <div id="main">
            <div id="toolbar">
                <!-- Nuevos inputs separados para carpeta vs archivos (mejor compatibilidad con móviles) -->
                <input type="file" id="dir-input" class="hidden-input" webkitdirectory multiple />
                <input type="file" id="file-input" class="hidden-input" multiple />

                <button class="load-btn" onclick="document.getElementById('dir-input').click()"
                    title="Seleccionar carpeta">📁 Carpeta</button>
                <button class="load-btn" onclick="document.getElementById('file-input').click()"
                    title="Seleccionar archivos sueltos">📄 Archivos</button>

                <div id="breadcrumb"><span style="color:#aaa;">Ninguna carpeta cargada</span></div>

                <input id="search" type="text" placeholder="Buscar..." oninput="filterFiles(this.value)" />

                <!-- Menú desplegable personalizado de extensiones -->
                <div id="ext-filter-container">
                    <button id="ext-btn" onclick="toggleExtMenu(event)">Formatos: Todos ▼</button>
                    <div id="ext-menu" class="hidden">
                        <div style="padding:4px;color:#999;font-size:11px;">Carga archivos primero</div>
                    </div>
                </div>

                <select id="sort-select" onchange="sortFiles(this.value)">
                    <option value="name">Nombre</option>
                    <option value="date">Fecha</option>
                    <option value="type">Tipo</option>
                </select>

                <div id="view-toggle">
                    <button class="view-btn active" id="btn-grid" onclick="setView('grid')"
                        title="Cuadrícula">⊞</button>
                    <button class="view-btn" id="btn-list" onclick="setView('list')" title="Lista">☰</button>
                </div>
                <button id="open-btn" disabled onclick="openSelected()">Abrir</button>
            </div>
            <div id="content" class="grid-view">
                <div class="empty-state">
                    <div class="empty-icon">📂</div>
                    <span>Carga carpetas o archivos para comenzar</span>
                </div>
            </div>
            <div id="statusbar">
                <span id="status-left">Sin archivos</span>
                <span id="status-right"></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
