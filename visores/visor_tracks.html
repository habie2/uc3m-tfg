<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizador BiciMAD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
  header{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 24px;display:flex;align-items:center;gap:12px}
  header h1{font-size:16px;font-weight:500}
  header span{font-size:12px;color:#888;background:#f0f0ee;padding:3px 8px;border-radius:99px}
  .main{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 53px)}
  .sidebar{background:#fff;border-right:1px solid #e5e5e5;overflow-y:auto;padding:16px}
  #map{width:100%;height:100%}
  textarea{width:100%;height:130px;font-family:monospace;font-size:11px;padding:10px;border:1px solid #ddd;border-radius:8px;background:#f9f9f8;color:#1a1a1a;resize:vertical;outline:none}
  textarea:focus{border-color:#888}
  .btn-row{display:flex;gap:8px;margin-top:8px}
  button{padding:7px 14px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#1a1a1a;cursor:pointer;font-size:13px}
  button:hover{background:#f5f5f3}
  .btn-vis{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  .btn-vis:hover{background:#333}
  .section{margin-top:16px}
  .section-title{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .metric{background:#f5f5f3;border-radius:8px;padding:10px 12px}
  .metric-label{font-size:11px;color:#888;margin-bottom:3px}
  .metric-val{font-size:16px;font-weight:500}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .field{background:#f5f5f3;border-radius:7px;padding:8px 10px}
  .field-key{font-size:10px;color:#888;margin-bottom:2px}
  .field-val{font-size:12px;font-weight:500;word-break:break-all}
  .track-point{border-left:3px solid #378ADD;padding:8px 10px;margin-bottom:6px;background:#f5f5f3;border-radius:0 7px 7px 0;cursor:pointer}
  .track-point:hover{background:#eaeaf8}
  .track-point.active{background:#e6f1fb;border-left-color:#68F527}
  .tp-addr{font-size:12px;font-weight:500;margin-bottom:4px}
  .tp-coords{font-size:10px;color:#888;font-family:monospace;margin-bottom:4px}
  .tp-tags{display:flex;gap:6px;flex-wrap:wrap}
  .tp-tag{font-size:11px;background:#fff;border:1px solid #e5e5e5;border-radius:5px;padding:2px 7px;color:#555}
  .tp-tag span{color:#1a1a1a;font-weight:500}
  .error{background:#fff0f0;color:#c00;padding:10px 12px;border-radius:8px;font-size:13px;border:1px solid #fcc}
  .raw-toggle{font-size:12px;color:#888;cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block}
  #raw-block{display:none;margin-top:8px;padding:10px;background:#f5f5f3;border-radius:7px;font-size:10px;font-family:monospace;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;border:1px solid #e5e5e5}
  .placeholder{color:#aaa;font-size:13px;text-align:center;padding:20px 0}
  .legend{display:flex;gap:12px;font-size:11px;color:#555;margin-top:8px}
  .legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1>Visualizador de trayectos</h1>
  <span>BiciMAD / GeoJSON</span>
</header>
<div class="main">
  <div class="sidebar">
    <div class="section-title">JSON del trayecto</div>
    <textarea id="json-input" placeholder="Pega aquí tu JSON..."></textarea>
    <div class="btn-row">
      <button class="btn-vis" onclick="parse()">Visualizar</button>
      <button onclick="loadExample()">Ejemplo</button>
      <button onclick="clearAll()">Limpiar</button>
    </div>
    <div id="output"></div>
  </div>
  <div id="map"></div>
</div>

<script>
const map = L.map('map').setView([40.416, -3.703], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

let mapLayers = [];
function clearMapLayers(){mapLayers.forEach(l=>map.removeLayer(l));mapLayers=[];}

const EXAMPLE = `{ "_id" : { "$oid" : "5b6779012f384302541d6813" }, "user_day_code" : "6c30d6e283ea7a160379fa9adb20b93d2c06e16853ad0804e26485e98066f6ba", "idplug_base" : 11, "track" : { "type" : "FeatureCollection", "features" : [ { "geometry" : { "type" : "Point", "coordinates" : [ -3.7078158, 40.4127144997222 ] }, "type" : "Feature", "properties" : { "var" : "28005,ES,Madrid,Madrid,CALLE SAN BRUNO 1,Madrid", "speed" : 6.19, "secondsfromstart" : 190 } }, { "geometry" : { "type" : "Point", "coordinates" : [ -3.7071841, 40.4156114997222 ] }, "type" : "Feature", "properties" : { "var" : "28012,ES,Madrid,Madrid,PLAZA MAYOR 27,Madrid", "speed" : 3.47, "secondsfromstart" : 130 } }, { "geometry" : { "type" : "Point", "coordinates" : [ -3.7048058, 40.4167895 ] }, "type" : "Feature", "properties" : { "var" : "28013,ES,Madrid,Madrid,CALLE ARENAL 1,Madrid", "speed" : 3.61, "secondsfromstart" : 71 } } ] }, "user_type" : 1, "idunplug_base" : 7, "travel_time" : 228, "idunplug_station" : 1, "ageRange" : 0, "idplug_station" : 43, "unplug_hourTime" : { "$date" : "2018-08-01T01:00:00.000+0200" }, "zip_code" : "" }`;

function loadExample(){document.getElementById('json-input').value=EXAMPLE;parse();}
function clearAll(){document.getElementById('json-input').value='';document.getElementById('output').innerHTML='';clearMapLayers();}

function fmt(val){
  if(val===null||val===undefined)return'—';
  if(typeof val==='object'){
    if(val['$oid'])return'<code style="font-size:10px">'+val['$oid'].slice(-10)+'…</code>';
    if(val['$date'])return new Date(val['$date']).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'});
    return JSON.stringify(val);
  }
  if(typeof val==='string'&&val==='')return'<span style="color:#aaa">vacío</span>';
  return String(val);
}

function makeIcon(color, size=12){
  return L.divIcon({
    className:'',
    html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`,
    iconSize:[size,size],
    iconAnchor:[size/2,size/2]
  });
}

function focusPoint(lat, lng, idx){
  map.setView([lat, lng], 17);
  document.querySelectorAll('.track-point').forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
  });
}

function parse(){
  const raw = document.getElementById('json-input').value.trim();
  const out = document.getElementById('output');
  clearMapLayers();
  if(!raw){out.innerHTML='';return;}
  let d;
  try{d=JSON.parse(raw);}catch(e){out.innerHTML='<div class="error">JSON inválido: '+e.message+'</div>';return;}

  const features=(d.track&&d.track.features)||[];
  const travelMin = d.travel_time ? (d.travel_time/60).toFixed(1) : null;
  const avgSpeed = features.length ? (features.reduce((s,f)=>s+(f.properties&&f.properties.speed||0),0)/features.length).toFixed(1) : null;
  const date = d.unplug_hourTime ? fmt(d.unplug_hourTime) : '—';

  // Draw on map
  if(features.length > 0){
    const sorted = [...features].sort((a,b)=>(a.properties.secondsfromstart||0)-(b.properties.secondsfromstart||0));
    const latlngs = sorted.map(f=>[f.geometry.coordinates[1], f.geometry.coordinates[0]]);

    const polyline = L.polyline(latlngs, {color:'#378ADD', weight:4, opacity:0.85});
    polyline.addTo(map);
    mapLayers.push(polyline);

    sorted.forEach((f,i)=>{
      const [lng,lat] = f.geometry.coordinates;
      const p = f.properties||{};
      const addr = p.var ? p.var.split(',').slice(4,6).join(', ') : 'Punto '+(i+1);
      const color = i===0 ? '#68F527' : i===sorted.length-1 ? '#F52727' : '#378ADD';
      const size = (i===0||i===sorted.length-1) ? 14 : 10;
      const marker = L.marker([lat,lng], {icon: makeIcon(color, size)});
      marker.bindPopup(`<b>${addr}</b><br>Velocidad: ${p.speed||0} km/h<br>Segundo: ${p.secondsfromstart||0}s<br><small style="color:#888">${lat.toFixed(6)}, ${lng.toFixed(6)}</small>`);
      marker.addTo(map);
      mapLayers.push(marker);
    });

    map.fitBounds(polyline.getBounds(), {padding:[30,30]});
  }

  // Sidebar HTML
  let html = '';

  // Metrics
  html += `<div class="section"><div class="metrics">
    <div class="metric"><div class="metric-label">Tiempo viaje</div><div class="metric-val">${travelMin ? travelMin+' min' : '—'}</div></div>
    <div class="metric"><div class="metric-label">Vel. media</div><div class="metric-val">${avgSpeed ? avgSpeed+' km/h' : '—'}</div></div>
    <div class="metric"><div class="metric-label">Puntos track</div><div class="metric-val">${features.length}</div></div>
    <div class="metric"><div class="metric-label">Inicio</div><div class="metric-val" style="font-size:12px">${date}</div></div>
  </div></div>`;

  // Fields
  html += `<div class="section"><div class="section-title">Datos del trayecto</div><div class="fields">`;
  [
    ['Base desenganche', d.idunplug_base], ['Estación desenganche', d.idunplug_station],
    ['Base enganche', d.idplug_base], ['Estación enganche', d.idplug_station],
    ['Tipo usuario', d.user_type], ['Rango edad', d.ageRange],
    ['Código postal', d.zip_code||'—'], ['Tiempo (s)', d.travel_time],
  ].forEach(([k,v])=>{
    html+=`<div class="field"><div class="field-key">${k}</div><div class="field-val">${fmt(v)}</div></div>`;
  });
  html += '</div></div>';

  // Track points
  if(features.length > 0){
    const sorted = [...features].sort((a,b)=>(a.properties.secondsfromstart||0)-(b.properties.secondsfromstart||0));
    html += `<div class="section"><div class="section-title">Puntos del track</div>`;
    html += `<div class="legend"><span><span class="legend-dot" style="background:#68F527"></span>Inicio</span><span><span class="legend-dot" style="background:#F52727"></span>Fin</span><span><span class="legend-dot" style="background:#378ADD"></span>Intermedio</span></div><div style="margin-top:8px">`;
    sorted.forEach((f,i)=>{
      const p = f.properties||{};
      const [lng,lat] = f.geometry.coordinates;
      const addr = p.var ? p.var.split(',').slice(4,6).join(', ') : 'Punto '+(i+1);
      const color = i===0 ? '#68F527' : i===sorted.length-1 ? '#F52727' : '#378ADD';
      html+=`<div class="track-point" onclick="focusPoint(${lat},${lng},${i})">
        <div style="display:flex;align-items:center;gap:7px">
          <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span>
          <div class="tp-addr">${addr}</div>
        </div>
        <div class="tp-coords">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
        <div class="tp-tags">
          <div class="tp-tag">Vel: <span>${p.speed||0} km/h</span></div>
          <div class="tp-tag">Seg: <span>${p.secondsfromstart||0}s</span></div>
          ${p.var ? '<div class="tp-tag">CP: <span>'+p.var.split(',')[0]+'</span></div>' : ''}
        </div>
      </div>`;
    });
    html += '</div></div>';
  }

  // Raw JSON toggle
  html += `<span class="raw-toggle" onclick="var b=document.getElementById('rb');b.style.display=b.style.display==='none'?'block':'none'">Ver JSON completo</span>
  <pre id="rb">${JSON.stringify(d,null,2).replace(/</g,'&lt;')}</pre>`;

  out.innerHTML = html;
}
</script>
</body>
</html>
